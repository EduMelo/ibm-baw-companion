<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Configurações - IBM BAW Companion</title>
    <link rel="icon" type="image/png" href="images/logo/baw-companion-16.png" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>Configurações</h1>
    <label>
      <input type="checkbox" id="toggleReopen" />
      Reabrir ProcessCenter automaticamente
    </label>

    <div class="option-group">
      <label for="hostname">BAW Hostname</label>
      <input type="text" id="hostname" placeholder="ex: ppsa-br.bpm.ibmcloud.com" />
    </div>

    <div class="option-group">
      <label for="bpmBasicAuth">Autenticação Basic do BPM (usuário:senha)</label>
      <input type="password" id="bpmBasicAuth" placeholder="usuario:senha" autocomplete="off" />
      <p class="option-hint">
        Usada pelo Process Inspector para orquestrar o moveToken reflexivo via REST. O valor é convertido para Base64
        automaticamente e fica salvo apenas neste navegador.
      </p>
    </div>

    <script src="options.js"></script>
  </body>
</html>
